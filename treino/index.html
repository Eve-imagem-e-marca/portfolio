<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#7A2E3A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Treino leve">
<title>Meu treino leve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única de celular, cartões recolhíveis com filete dourado, letras grandes */
:root{
  --bg:#FBF8F3; --card:#FFFFFF; --ink:#3A2A24; --muted:#7A6A62;
  --marsala:#7A2E3A; --on-marsala:#FFFFFF; --petrol:#1F5560; --gold:#B8935A;
  --line:#E8DED2; --soft:#F3EBE1;
  --display:'Cormorant Garamond',Georgia,serif; --body:'DM Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1D1715; --card:#2A211E; --ink:#F2E8DE; --muted:#B9A99E;
    --marsala:#D98794; --on-marsala:#2A1519; --petrol:#7CC1CC; --gold:#D2B27A;
    --line:#41342F; --soft:#332925; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1715; --card:#2A211E; --ink:#F2E8DE; --muted:#B9A99E;
  --marsala:#D98794; --on-marsala:#2A1519; --petrol:#7CC1CC; --gold:#D2B27A;
  --line:#41342F; --soft:#332925; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-bottom:110px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.1;margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.rule{height:1px;background:var(--gold);border:0;margin:14px 0}
.week{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.week b{font-family:var(--display);font-size:26px;color:var(--marsala);line-height:1}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.tab{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 0;min-height:46px;cursor:pointer;position:relative}
.tab[aria-selected="true"]{background:var(--marsala);color:var(--on-marsala);border-color:var(--marsala)}
.tab .dot{position:absolute;top:5px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.sug{font-size:14px;color:var(--petrol);font-weight:700;margin:0 0 6px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.chip{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--muted);background:var(--card)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:var(--petrol);border-radius:99px;transition:width .3s}
.cnt{font-size:14px;color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:14px;margin-bottom:12px;overflow:hidden}
.head{display:flex;align-items:center;gap:12px;padding:14px}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--petrol);background:transparent;color:var(--on-marsala);display:grid;place-items:center;cursor:pointer;padding:0}
.chk svg{width:18px;height:18px;opacity:0}
.card.done .chk{background:var(--petrol);border-color:var(--petrol)}
.card.done .chk svg{opacity:1}
.card.done .name{text-decoration:line-through;text-decoration-color:var(--gold);color:var(--muted)}
.toggle{flex:1;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.name{font-weight:700;font-size:18px;line-height:1.25}
.how{font-size:15px;color:var(--muted)}
.chev{flex:none;width:20px;height:20px;color:var(--gold);transition:transform .2s}
.card.open .chev{transform:rotate(180deg)}
.body{display:none;padding:0 14px 16px;border-top:1px solid var(--line)}
.card.open .body{display:block}
.body h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--petrol);margin:16px 0 6px}
.body ol{margin:0;padding-left:22px}
.body li{margin-bottom:6px}
.tip{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:16px}
.tip b{color:var(--marsala)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;background:var(--marsala);color:var(--on-marsala);padding:12px 18px;min-height:46px;cursor:pointer}
.btn.alt{background:transparent;color:var(--marsala);border:1.5px solid var(--marsala)}
.kg{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.kg input{font:inherit;width:84px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);min-height:44px}
.info{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 16px}
.info .toggle{padding:12px 14px;flex-direction:row;align-items:center;justify-content:space-between;width:100%;font-weight:700}
.info .body{border-top:1px solid var(--line)}
.info.open .body{display:block}
.info.open .chev{transform:rotate(180deg)}
.finish{width:100%;margin-top:8px;font-size:18px}
.done-msg{background:var(--petrol);color:var(--on-marsala);border-radius:14px;padding:16px;margin-top:14px;text-align:center}
.done-msg b{font-family:var(--display);font-size:26px;display:block}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--petrol);color:var(--on-marsala);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;justify-content:space-between;gap:12px;z-index:5}
.timer.on{display:flex}
.timer.end{background:var(--marsala)}
.timer .t{font-family:var(--display);font-size:34px;font-weight:600;line-height:1}
.timer .l{font-size:14px;opacity:.9}
.timer button{font:inherit;font-weight:700;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Animações dos exercícios */
.anim{background:var(--soft);border-radius:12px;padding:10px;margin-top:6px;text-align:center}
.anim svg{width:100%;height:auto;display:block}
.anim .acap{font-weight:700;color:var(--petrol);min-height:28px;margin:4px 0 8px}
.btn.small{padding:8px 16px;min-height:42px;font-size:15px}
.anim .bd{stroke:var(--petrol);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
.anim .far{opacity:.4}
.anim .hd{fill:var(--card);stroke:var(--petrol);stroke-width:5}
.anim .foc{stroke:var(--marsala);opacity:.35;fill:none;stroke-linecap:round}
.anim .foc2{fill:var(--marsala);opacity:.35}
.anim .db{fill:var(--marsala)}
.anim .prop{fill:var(--card);stroke:var(--gold);stroke-width:2}
.anim .prop2{stroke:var(--gold);stroke-width:3;fill:var(--card);stroke-linecap:round}
.anim .cab{stroke:var(--gold);stroke-width:2;fill:none}
.anim .floorl{stroke:var(--gold);stroke-width:2}
.anim .mat{fill:var(--line)}
.anim .band{stroke:var(--marsala);stroke-width:3;fill:none}
.anim .roll{fill:var(--card);stroke:var(--gold);stroke-width:2}
.anim .foot{fill:var(--petrol);stroke:var(--petrol);stroke-width:4;stroke-linejoin:round}

/* Navegação e novas telas */
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:16px}
.nav .tab{font-size:13px;padding:10px 0;min-height:44px}
.subt{font-weight:400;color:var(--muted);font-size:15px}
.big{font-family:var(--display);font-weight:600;font-size:46px;line-height:1;color:var(--marsala);margin:4px 0 4px}
.big small{font-family:var(--body);font-size:16px;font-weight:400;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin:8px 0}
.chart .gr{stroke:var(--line);stroke-width:1.5;fill:none}
.chart .ln{stroke:var(--petrol);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--marsala)}
.chart .tx{fill:var(--muted);font-size:10.5px;font-family:var(--body)}
.chart .tx.b{fill:var(--ink);font-weight:700}
.chart .bar{fill:var(--gold)}
.chart .bar.ok{fill:var(--petrol)}
.chart .ga{fill:none;stroke-width:18}
.chart .g0{stroke:var(--line)}
.chart .z1,.sw.z1{stroke:var(--petrol);opacity:.45;background:var(--petrol)}
.chart .z2,.sw.z2{stroke:var(--petrol);background:var(--petrol)}
.chart .z3,.sw.z3{stroke:var(--gold);background:var(--gold)}
.chart .z4,.sw.z4{stroke:var(--marsala);background:var(--marsala)}
.chart .needle{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.chart .hub{fill:var(--ink)}
.chart .gnum{fill:var(--ink);font-family:var(--display);font-weight:600;font-size:24px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.sw.z1{opacity:.45}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.lnk{font:inherit;font-size:14px;background:none;border:0;color:var(--marsala);text-decoration:underline;cursor:pointer;min-height:40px;padding:0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--soft);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-family:var(--display);font-size:30px;color:var(--marsala);line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.bdg{display:inline-flex;align-items:center;gap:6px;font-size:15px;border:1px dashed var(--line);color:var(--muted);border-radius:999px;padding:6px 12px}
.bdg.on{border:1px solid var(--gold);color:var(--ink);background:var(--soft)}
.bdg svg{width:14px;height:14px;color:var(--petrol)}
.tbl .tr{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px;text-align:center}
.tbl .th{font-size:13px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:14px;padding:14px;margin-top:12px}
.rg{margin-bottom:12px}
.rg label{font-weight:700;display:block;font-size:16px}
.rgr{display:flex;align-items:center;gap:12px}
.rgr input{flex:1;accent-color:var(--petrol);min-height:36px}
.rgr output{font-family:var(--display);font-size:26px;color:var(--marsala);min-width:28px;text-align:right}
.ta{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);margin-top:6px}
.kg input.bad,.ta.bad{border-color:var(--marsala);outline:2px solid var(--marsala)}
.chk.on{background:var(--petrol);border-color:var(--petrol)}
.chk.on svg{opacity:1}
.info .head{padding:8px 0}
.info .tip{margin-top:10px}
.info .body{padding-top:2px}

.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-family:var(--display);font-size:24px}
.calh .btn{min-width:48px;font-size:20px;padding:6px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-size:13px;color:var(--muted);padding:4px 0}
.cd{font:inherit;position:relative;min-height:50px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:4px 0 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.cd.hoje{border-color:var(--marsala);border-width:2px;font-weight:700}
.cd.sel{background:var(--soft);outline:2px solid var(--gold)}
.cd.plan{border-style:dashed;border-color:var(--petrol)}
.dots{display:flex;gap:3px;min-height:8px;padding-bottom:3px}
.dots i,.legend i{display:inline-block;width:8px;height:8px;border-radius:50%}
.p1{background:var(--petrol)}.p2{background:var(--gold)}.p3{background:var(--marsala)}
.legend i.pl{background:transparent;border:1.5px dashed var(--petrol)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:46px;cursor:pointer}
.wd.on{background:var(--petrol);border-color:var(--petrol);color:var(--on-marsala);font-weight:700}
.stp{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stp .btn{min-width:52px;font-size:20px}
.filebtn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:var(--marsala);color:var(--on-marsala);border-radius:999px;font-weight:700}
.phg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phg img,.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block;background:var(--soft)}
.phg figure,.cmp figure{margin:0}
figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.nav{grid-template-columns:repeat(3,1fr)!important}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);background:var(--marsala);color:var(--on-marsala);padding:12px 18px;border-radius:999px;font-weight:700;font-size:15px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.toast.on{transform:translate(-50%,0)}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:55}
.conf i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.yt{display:inline-flex;align-items:center;gap:8px;text-decoration:none;margin-top:12px}
.ill{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.ill div{background:var(--soft);border-radius:14px;padding:8px 4px;text-align:center;font-size:13px;line-height:1.25}
.ill svg{width:100%;height:64px;display:block;margin-bottom:4px}
.plate{display:flex;gap:14px;align-items:center;margin:8px 0}
.plate svg{width:120px;flex:none}
.plate ul{list-style:none;margin:0;padding:0;font-size:14px;line-height:1.7}
.plate b{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.gh{display:flex;align-items:center;gap:8px;margin:18px 0 4px}
.gh span{font-size:26px}
.gh h3{margin:0}
.sh{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.sh .nm{flex:1;font-size:16px}
.sh .qt{font-size:13px;color:var(--muted);text-align:right}
.sh.on .nm{text-decoration:line-through;color:var(--muted)}
.emo{font-size:20px;margin-right:6px}
@media (prefers-reduced-motion:reduce){.conf{display:none}.toast{transition:none}}
.nav{grid-template-columns:repeat(4,1fr)!important}
.rc ul,.rc ol{margin:6px 0 10px;padding-left:20px;line-height:1.55}
.rc .meta{margin:0 0 8px}
.brand{text-align:center;font-size:13px;color:var(--muted);margin:28px 0 90px}.brand a{color:var(--marsala);text-decoration:none}
.me{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.av{width:56px;height:56px;border-radius:50%;background:var(--soft);border:2px solid var(--gold);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.pf label{display:block;font-size:14px;margin:10px 0 4px;color:var(--muted)}
.pf input[type=text],.pf input[type=tel],.pf select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:44px}
.pfp{display:flex;align-items:center;gap:14px}
.yas{background:var(--soft);border-radius:14px;padding:12px;margin:10px 0}.yas textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:90px}.yas select,.yas input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:44px}.yas label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}.stp{font-weight:700;color:var(--petrol);margin:14px 0 0}.ans{white-space:pre-wrap;font-size:15px;line-height:1.5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0}

/* ---------- Visual: vidro, brilho e movimento ---------- */
body{background:radial-gradient(circle at 8% -4%,color-mix(in srgb,var(--gold) 24%,transparent) 0,transparent 42%),radial-gradient(circle at 100% 18%,color-mix(in srgb,var(--marsala) 14%,transparent) 0,transparent 38%),var(--bg);background-attachment:fixed}
.btn{background:linear-gradient(135deg,color-mix(in srgb,var(--marsala) 88%,#fff),var(--marsala));box-shadow:0 6px 16px color-mix(in srgb,var(--marsala) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .15s,box-shadow .15s}
.btn:active,.tab:active,.chip:active{transform:scale(.95)}
.btn.alt{background:color-mix(in srgb,var(--card) 50%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid color-mix(in srgb,var(--marsala) 55%,transparent);box-shadow:none;color:var(--marsala)}
.tab{background:color-mix(in srgb,var(--card) 55%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-color:color-mix(in srgb,var(--gold) 45%,transparent);transition:transform .15s,background .2s,box-shadow .2s}
.tab[aria-selected="true"]{background:linear-gradient(135deg,color-mix(in srgb,var(--marsala) 88%,#fff),var(--marsala));box-shadow:0 5px 14px color-mix(in srgb,var(--marsala) 35%,transparent);border-color:transparent}
.card,.info,.panel,.week{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(60,30,20,.07);border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.chip{background:color-mix(in srgb,var(--card) 60%,transparent)}
.bar i{background:linear-gradient(90deg,var(--petrol),var(--gold))}
.nav{position:sticky;top:0;z-index:30;padding:8px 0;margin:0 0 12px;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app.go>*{animation:rise .4s both}
#app.go>*:nth-child(2){animation-delay:.05s}#app.go>*:nth-child(3){animation-delay:.1s}#app.go>*:nth-child(4){animation-delay:.15s}
.hero{display:flex;align-items:center;gap:14px;padding:12px 14px;margin:0 0 6px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--marsala) 16%,var(--card)),color-mix(in srgb,var(--gold) 16%,var(--card)));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);box-shadow:0 6px 22px rgba(60,30,20,.10)}
.ring{position:relative;width:84px;height:84px;flex:none;border:0;background:none;padding:0;cursor:pointer;transition:transform .15s}
.ring:active{transform:scale(.94)}
.ring svg{position:absolute;inset:0;width:84px;height:84px;transform:rotate(-90deg)}
.ring .av{position:absolute;left:9px;top:9px;width:66px;height:66px;border:0;font-size:30px}
.ring .pc{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--marsala);color:var(--on-marsala);font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hinfo{flex:1;min-width:0}

<script>
/*ANIM-START*/
/* Motor de animação: bonequinho de lado, feito de segmentos (ângulos ou alvos com IK) */
(function(root){
const L={torso:52,neck:8,head:10,ua:28,fa:26,th:40,sh:40,ft:14};
const FLOOR=172,R=3.5,AY=FLOOR-R;
const rad=a=>a*Math.PI/180;
const P=(p,a,l)=>[p[0]+Math.sin(rad(a))*l,p[1]+Math.cos(rad(a))*l];
const f=n=>Math.round(n*10)/10;
const lerp=(a,b,e)=>a+(b-a)*e;
function ik(p0,tg,l1,l2,side){
  let dx=tg[0]-p0[0],dy=tg[1]-p0[1],d=Math.hypot(dx,dy)||0.001;
  const mx=l1+l2-0.05; if(d>mx){const k=mx/d;dx*=k;dy*=k;d=mx;}
  const a=(l1*l1-l2*l2+d*d)/(2*d), h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const nx=dy/d, ny=-dx/d;
  return {mid:[p0[0]+dx*a/d+nx*h*side,p0[1]+dy*a/d+ny*h*side],end:[p0[0]+dx,p0[1]+dy]};
}
function solve(p){
  const abs=!!p.hip;
  const hip=abs?p.hip.slice():[p.hx!=null?p.hx:150,0];
  const t=p.t!=null?p.t:180;
  const o={hip};
  o.shoulder=P(hip,t,L.torso);
  const arch=p.arch||0, mid=[(hip[0]+o.shoulder[0])/2,(hip[1]+o.shoulder[1])/2];
  o.ctrl=[mid[0]+Math.cos(rad(t))*arch*2,mid[1]-Math.sin(rad(t))*arch*2];
  const leg=k=>{
    if(p['ankle'+k]){const r=ik(hip,p['ankle'+k],L.th,L.sh,p['ks'+k]||1);return [r.mid,r.end];}
    if(p['th'+k]!=null){const kn=P(hip,p['th'+k],L.th);return [kn,P(kn,p['sh'+k]||0,L.sh)];}
    return null;};
  const l1=leg('')||[P(hip,0,L.th),P(P(hip,0,L.th),0,L.sh)];
  o.knee=l1[0];o.ankle=l1[1];o.toe=P(o.ankle,p.ft!=null?p.ft:90,L.ft);
  const l2=leg('2');
  if(l2){o.knee2=l2[0];o.ankle2=l2[1];o.toe2=P(o.ankle2,p.ft2!=null?p.ft2:90,L.ft);}
  const arm=k=>{
    if(p['hand'+k]){const r=ik(o.shoulder,p['hand'+k],L.ua,L.fa,p['es'+k]||-1);return [r.mid,r.end];}
    if(p['ua'+k]!=null){const e=P(o.shoulder,p['ua'+k],L.ua);return [e,P(e,p['fa'+k]!=null?p['fa'+k]:p['ua'+k],L.fa)];}
    return null;};
  const a1=arm('')||[P(o.shoulder,0,L.ua),P(P(o.shoulder,0,L.ua),0,L.fa)];
  o.elbow=a1[0];o.hand=a1[1];
  const a2=arm('2'); if(a2){o.elbow2=a2[0];o.hand2=a2[1];}
  o.head=P(o.shoulder,t+(p.h||0),L.neck+L.head);
  if(!abs){
    const pts=['hip','knee','ankle','toe','shoulder','elbow','hand','knee2','ankle2','toe2'].map(k=>o[k]).filter(Boolean);
    const maxY=Math.max(...pts.map(q=>q[1]));

}
const pt=q=>f(q[0])+' '+f(q[1]);
const path=(...q)=>'M'+q.map(pt).join('L');

  let s='';

  if(o.hand2) s+='<path class="bd far" d="'+path(o.shoulder,o.elbow2,o.hand2)+'"/>';
  const spine=p.arch?'M'+pt(o.hip)+'Q'+pt(o.ctrl)+' '+pt(o.shoulder):path(o.hip,o.shoulder);
  s+='<path class="bd" d="'+path(o.hip,o.knee,o.ankle,o.toe)+'"/>';

  const at=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k)];
  fo.forEach(k=>{
    if(k==='th')s+=seg(o.hip,o.knee);

    else if(k==='arm')s+=seg(o.shoulder,o.elbow,11)+seg(o.elbow,o.hand,11);

    else if(k==='lumbar')s+=dot(at(o.hip,o.shoulder,.22),9);

  if(p.db) s+='<circle class="db" cx="'+f(o.hand[0])+'" cy="'+f(o.hand[1])+'" r="5.5"/>';

}
const FL='<line class="floorl" x1="10" y1="172" x2="290" y2="172"/>';
const rect=(x,y,w,h,c)=>'<rect class="'+(c||'prop')+'" x="'+f(x)+'" y="'+f(y)+'" width="'+f(w)+'" height="'+f(h)+'" rx="3"/>';

/* ---------- Exercícios ---------- */

      s+='<path class="foc" style="stroke-width:12" d="'+path(a,b)+'"/><path class="bd" d="'+path([150,44],a,b,c)+'"/><circle class="db" cx="'+f(c[0])+'" cy="'+f(c[1])+'" r="6"/>';});

  draw:e=>{const w=lerp(20,40,e);const hip=[150,112];const ra=[150+w,168.5],la=[150-w*0.4,168.5];
    const kr=[hip[0]+ (ra[0]-hip[0])/2+8,140],kl=[hip[0]+(la[0]-hip[0])/2-8,140];

A.bike={type:'fn',dur:2200,caps:['Pedale num ritmo leve'],
  fn:u=>{const ph=u*2*Math.PI,C=[146,146],r=18;
    const a1=[C[0]+Math.cos(ph)*r,C[1]+Math.sin(ph)*r],a2=[C[0]-Math.cos(ph)*r,C[1]-Math.sin(ph)*r];
    return {hip:[108,95],t:140,h:-10,ankle:a1,ankle2:a2,hand:[190,62],ua2:0,fa2:0};},
  bg:line([96,100],[98,150],'prop2')+rect(82,92,34,8)+line([190,62],[148,146],'cab')+circ([146,146],4,'prop2')+line([80,168],[215,168],'cab')+circ([160,140],14,'cab'),

function walk(lift,arms){return u=>{const A0=AY;
    const foot=ph=>{ph=((ph%1)+1)%1;if(ph<.5){const k=ph/.5;return [150+24-48*k,A0];}const k=(ph-.5)/.5;return [150-24+48*k,A0-lift*Math.sin(Math.PI*k)];};
    const sw=Math.sin(u*2*Math.PI)*arms;
    return {hip:[150,92.5],t:178,h:-5,ankle:foot(u),ankle2:foot(u+.5),ua:-sw,fa:-sw+45,ua2:sw,fa2:sw+45};};}

A.elip={type:'fn',dur:1800,caps:['Movimento suave, como andar'],fn:walk(4,22),focus:['th'],
  bg:line([210,172],[210,70],'cab')+rect(200,60,24,10)+line([210,172],[170,172],'cab')};

const TIMING={hold:700,move:1500};
const ease=e=>e<.5?2*e*e:1-Math.pow(-2*e+2,2)/2;
function lerpPose(a,b,e){const r={};const keys=new Set(Object.keys(a).concat(Object.keys(b)));
  keys.forEach(k=>{const x=a[k],y=b[k];
    if(x==null)r[k]=y;else if(y==null)r[k]=x;
    else if(typeof x==='number'&&typeof y==='number')r[k]=lerp(x,y,e);
    else if(Array.isArray(x)&&Array.isArray(y))r[k]=x.map((v,i)=>lerp(v,y[i],e));
    else r[k]=x;});return r;}
/* estado em um instante (ms): devolve {svg, cap} */
function frameAt(cfg,ms){
  if(cfg.type==='fn'){const u=(ms%cfg.dur)/cfg.dur;const p=cfg.fn(u);const o=solve(p);
    return {svg:FL+(cfg.bg||'')+figure(o,p,cfg),cap:cfg.caps[0]};}
  const seg=TIMING.hold+TIMING.move,tot=seg*2;let m=ms%tot;let e,leg;
  if(m<seg){leg=0;e=m<TIMING.hold?0:ease((m-TIMING.hold)/TIMING.move);}
  else{m-=seg;leg=1;e=1-(m<TIMING.hold?0:ease((m-TIMING.hold)/TIMING.move));}
  // leg 0: A->B (e sobe), leg 1: B->A (e desce); a legenda acompanha o trecho
  if(cfg.type==='custom'){return {svg:FL+(cfg.bg||'')+cfg.draw(e),cap:cfg.caps[leg]};}
  const p=lerpPose(cfg.frames[0],cfg.frames[1],e);
  if(cfg.db)p.db=true;
  const o=solve(p);
  return {svg:FL+(cfg.bg||'')+(cfg.dyn?cfg.dyn(o,e):'')+figure(o,p,cfg),cap:cfg.caps[leg]};
}
root.ANIM={A,frameAt,solve,TIMING};
if(typeof module!=='undefined')module.exports=root.ANIM;

/* ---------- Gráficos simples ---------- */
function lineChart(pts,unit){
  pts=pts.slice(-12);
  if(pts.length<2)return '<p class="how" style="margin:8px 0">Salve mais uma medida para ver o gráfico.</p>';
  const W=300,H=130,pl=14,pr=14,pt=22,pb=24;
  const vs=pts.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);
  if(mx-mn<1){mn-=.5;mx+=.5}const pd=(mx-mn)*.2;mn-=pd;mx+=pd;
  const x=i=>pl+(W-pl-pr)*i/(pts.length-1), y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="Gráfico de '+unit+'">';
  s+='<path class="gr" d="M'+pl+' '+(H-pb)+'L'+(W-pr)+' '+(H-pb)+'"/>';
  s+='<path class="ln" d="'+pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join('')+'"/>';
  pts.forEach((p,i)=>{s+='<circle class="dot" cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(i===pts.length-1?5:3.2)+'"/>';});
  const last=pts[pts.length-1],first=pts[0];
  s+='<text class="tx" x="'+x(0)+'" y="'+(y(first.v)-9).toFixed(1)+'" text-anchor="start">'+k1(first.v)+'</text>';
  s+='<text class="tx b" x="'+x(pts.length-1)+'" y="'+(y(last.v)-10).toFixed(1)+'" text-anchor="end">'+k1(last.v)+' '+unit+'</text>';
  s+='<text class="tx" x="'+x(0)+'" y="'+(H-6)+'" text-anchor="start">'+dm(first.d)+'</text>';
  s+='<text class="tx" x="'+x(pts.length-1)+'" y="'+(H-6)+'" text-anchor="end">'+dm(last.d)+'</text></svg>';
  return s;
}
function barChart(vals,labels,goal){
  const W=300,H=130,pl=10,pr=10,pt=18,pb=22,n=vals.length,mx=Math.max(goal,...vals,1);
  const bw=(W-pl-pr)/n;let s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="Treinos por semana">';
  const gy=pt+(H-pt-pb)*(1-goal/mx);
  s+='<path class="gr" d="M'+pl+' '+gy.toFixed(1)+'L'+(W-pr)+' '+gy.toFixed(1)+'" stroke-dasharray="4 4"/>';
  vals.forEach((v,i)=>{const h=(H-pt-pb)*v/mx,x=pl+i*bw+bw*.18;
    s+='<rect class="'+(v>=goal?'bar ok':'bar')+'" x="'+x.toFixed(1)+'" y="'+(H-pb-h).toFixed(1)+'" width="'+(bw*.64).toFixed(1)+'" height="'+Math.max(h,v?2:0).toFixed(1)+'" rx="4"/>';
    s+='<text class="tx" x="'+(x+bw*.32).toFixed(1)+'" y="'+(H-pb-h-4).toFixed(1)+'" text-anchor="middle">'+v+'</text>';
    s+='<text class="tx" x="'+(x+bw*.32).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+labels[i]+'</text>';});
  return s+'</svg>';
}
function gauge(bpm,mx){
  const lo=.4,hi=1,cx=150,cy=126,r=100;
  const ang=p=>Math.PI*(1-(p-lo)/(hi-lo));
  const xy=(p,rr)=>[cx+rr*Math.cos(ang(p)),cy-rr*Math.sin(ang(p))];
  const arc=(a,b,c)=>{const s=xy(a,r),e=xy(b,r);return '<path class="'+c+'" d="M'+s[0].toFixed(1)+' '+s[1].toFixed(1)+'A'+r+' '+r+' 0 0 1 '+e[0].toFixed(1)+' '+e[1].toFixed(1)+'"/>';};
  let s='<svg viewBox="0 0 300 162" class="chart" role="img" aria-label="Medidor do coração">';
  s+=arc(.4,.5,'ga g0')+arc(.5,.6,'ga z1')+arc(.6,.75,'ga z2')+arc(.75,.85,'ga z3')+arc(.85,1,'ga z4');
  if(bpm>0){const p=Math.min(hi,Math.max(lo,bpm/mx)),e=xy(p,r-30);
    s+='<path class="needle" d="M'+cx+' '+cy+'L'+e[0].toFixed(1)+' '+e[1].toFixed(1)+'"/><circle class="hub" cx="'+cx+'" cy="'+cy+'" r="7"/>';
    s+='<text class="gnum" x="'+cx+'" y="'+(cy+34)+'" text-anchor="middle">'+Math.round(bpm)+' bpm</text>';}
  else s+='<text class="tx" x="'+cx+'" y="'+(cy+8)+'" text-anchor="middle">Digite seus batimentos</text>';
  return s+'</svg>';
}
function zoneInfo(bpm,mx){
  const p=bpm/mx;
  if(p<.5)return ['Abaixo da faixa leve','Bom para aquecer. Pode aumentar um pouquinho o ritmo.'];
  if(p<.6)return ['Leve','Ótimo para aquecer e para esfriar no final.'];
  if(p<.75)return ['Moderada (ideal)','Esta é a faixa certa para o seu cardio. Dá para conversar.'];
  if(p<.85)return ['Forte','Faça por pouco tempo. Se faltar ar, diminua o ritmo.'];
  return ['Muito forte','Reduza o ritmo agora e respire fundo. Se sentir tontura ou dor no peito, pare.'];
}

function streak(){
  const set=new Set(S.hist.map(h=>h.d));let d=new Date(today+'T12:00:00'),n=0;
  if(!set.has(ymd(d)))d.setDate(d.getDate()-1);
  while(set.has(ymd(d))){n++;d.setDate(d.getDate()-1);}return n;
}
function renderProgresso(){
  const total=S.hist.length, wk=weekHist().length;
  const labels=[],vals=[];

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DSEM=['segunda','terça','quarta','quinta','sexta','sábado','domingo'];
let calY=new Date().getFullYear(), calM=new Date().getMonth(), selD=today;
const wdOf=ds=>(new Date(ds+'T12:00:00').getDay()+6)%7+1; // 1=segunda ... 7=domingo
function plannedDay(target){
  let seq=suggested();const d=new Date(today+'T12:00:00');
  if(S.hist.some(h=>h.d===today))d.setDate(d.getDate()+1);
  for(let i=0;i<400;i++){const ds=ymd(d);
    if(S.plan.includes(wdOf(ds))){if(ds===target)return seq;seq=seq%5+1;}
    if(ds>=target)break;d.setDate(d.getDate()+1);}
  return null;
}
function dayData(ds){
  return {tr:S.hist.filter(h=>h.d===ds),
    ag:ds===today?(S.water||0):(S.wh[ds]||0),
    cd:S.cardio.filter(c=>c.d===ds).reduce((t,c)=>t+c.min,0),
    w:S.weights.find(x=>x.d===ds),c:S.waist.find(x=>x.d===ds),b:S.bp.filter(x=>x.d===ds),
    sl:S.sleep.find(x=>x.d===ds),ck:S.checks.filter(x=>x.d===ds),ph:PH.filter(x=>x.d===ds)};
}

  const wd=DSEM[wdOf(selD)-1];
  let det='<h3 style="margin-top:0">'+wd+', '+dn+'/'+selD.slice(5,7)+'</h3>';

  if(x.tr.length)det+=li('Treino','feito: '+x.tr.map(t=>'Dia '+t.day).join(' e '));

    if(selD>=today&&pd)det+=li('Treino planejado','Dia '+pd+' · '+DAYS[pd-1].nome);

  det+=li('Água',x.ag+' de '+wg()+' copos');

  if(x.w)det+=li('Peso',k1(x.w.kg)+' kg');

  if(selD===today)det+='<div class="row"><button class="btn small" data-act="goTreino">Ir para o treino de hoje</button></div>';
  h+='<div class="panel" style="margin:12px 0 16px">'+det+'</div>';

  return h;
}

function addPhoto(file){
  const note=t=>{const m=document.getElementById('phmsg');if(m)m.textContent=t;};
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      PH.push({d:today,img:c.toDataURL('image/jpeg',0.72)});
      if(!savePh()){PH.pop();note('Sem espaço para mais fotos neste aparelho. Apague uma antiga e tente de novo.');return;}
      openId='fotos';render();};
    im.onerror=()=>note('Não consegui abrir essa foto. Tente outra.');
    im.src=fr.result;};
  fr.onerror=()=>note('Não consegui ler a foto.');
  fr.readAsDataURL(file);
}

let tm=null, tEnd=0;
const tBox=document.getElementById('timer'), tt=document.getElementById('tt'), tl=document.getElementById('tl');
function startTimer(sec,label){
  clearInterval(tm); tEnd=Date.now()+sec*1000; tl.textContent=label; tBox.classList.add('on'); tBox.classList.remove('end');
  tick(); tm=setInterval(tick,250);
}
function tick(){
  const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  tt.textContent=fmt(left);
  if(left<=0){
    clearInterval(tm); tBox.classList.add('end'); tl.textContent='Pronto! Siga para o próximo.';
    try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
    setTimeout(()=>{if(Date.now()>=tEnd)tBox.classList.remove('on')},6000);
  }
}

const ANIMMAP={bike_aq:'bike',bike_cardio:'bike',esteira_aq:'walk',esteira_cardio:'walk',eliptico_aq:'elip'};
let raf=0,lastTs=0,animClock=0;
let animPaused=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function startAnim(){
  cancelAnimationFrame(raf);
  const box=document.querySelector('.card.open .anim'); if(!box)return;
  const cfg=ANIM.A[ANIMMAP[box.dataset.id]||box.dataset.id]; if(!cfg)return;
  const g=box.querySelector('.ag'),cap=box.querySelector('.acap'),btn=box.querySelector('[data-act="pause"]');
  btn.textContent=animPaused?'Ver o movimento':'Pausar';
  animClock=0;lastTs=0;
  const draw=()=>{const r=ANIM.frameAt(cfg,animClock);g.innerHTML=r.svg;cap.textContent=r.cap;};
  draw();
  const loop=ts=>{if(!lastTs)lastTs=ts;const dt=Math.min(100,ts-lastTs);lastTs=ts;if(!animPaused){animClock+=dt;draw();}raf=requestAnimationFrame(loop);};
  raf=requestAnimationFrame(loop);
}

function doFinish(){
  const day=DAYS.find(d=>d.n===S.cur);let cm=0;
  day.itens.forEach((it,i)=>{
    const raw=S.kg[it.id],n=num(raw);
    if(raw&&isFinite(n)){const a=S.kgHist[it.id]=S.kgHist[it.id]||[];const l=a[a.length-1];if(!l||l.d!==today||l.kg!==n)a.push({d:today,kg:n});}
    if(S.done[S.cur+':'+i]&&CARDIO_IDS.includes(it.id)&&it.t)cm+=Math.round(it.t/60);
  });
  if(cm>0)S.cardio.push({d:today,min:cm,auto:true});
  S.hist.push({d:today,day:S.cur});S.hist=S.hist.slice(-400);
  day.itens.forEach((it,i)=>{delete S.done[S.cur+':'+i]});
  finished=true;ckPending=true;openId=null;save();render();
  {const n=weekHist().length;celebrate(n>=wkg()?'Meta da semana batida! Você é incrível 🏆':'Parabéns! Treino feito 🎉',true);}

    if(S.done[k]){const dy=DAYS.find(d=>d.n===S.cur);if(dy.itens.every((it,i)=>S.done[dy.n+':'+i]))celebrate('Parabéns! Todos os exercícios de hoje 🎉',true);else celebrate(PRAISE[Math.floor(Math.random()*PRAISE.length)],false);}}
  else if(a==='shop'){const k=b.dataset.k;S.shop[k]=!S.shop[k];save();render();
    let all=true;SHOP.forEach((g,gi)=>g[2].forEach((it,ii)=>{if(!S.shop[gi+'-'+ii])all=false;}));if(all)celebrate('Compras completas! 🛒',true);}
  else if(a==='yasgo'){if(!S.yas.q){toast('Escolha primeiro o que você quer');return;}
    const t=yasPrompt();const go=()=>{toast('Pedido copiado! Cole no Gemini');setTimeout(()=>window.open('https://gemini.google.com/app','_blank','noopener'),700);};
    try{navigator.clipboard.writeText(t).then(go,()=>{prompt('Copie este pedido:',t);});}catch(er){go();}}
  else if(a==='yassave'){const t=(S.yas.r||'').trim();if(!t){toast('Cole a resposta primeiro');return;}
    S.yas.list=S.yas.list||[];S.yas.list.unshift({d:today,q:S.yas.q||'',t:t});S.yas.list=S.yas.list.slice(0,10);S.yas.r='';save();render();celebrate('Guardado! Boa escolha 🥗',false);}
  else if(a==='yasdel'){S.yas.list.splice(+b.dataset.i,1);save();render();}
  else if(a==='goperfil'){view='corpo';openId='perfil';render();window.scrollTo({top:0});}
  else if(a==='goagua'){view='treino';openId='agua';render();window.scrollTo({top:0});}
  else if(a==='resumo'){
    const w=S.weights[S.weights.length-1],c=S.waist[S.waist.length-1],bp=S.bp[S.bp.length-1];
    let t='Meu resumo ('+dm(today)+')\n';
    t+=(w&&!w.seed)?'Peso: '+k1(w.kg)+' kg (em '+dm(w.d)+')\n':'';
    t+=c?'Cintura: '+k1(c.cm)+' cm (em '+dm(c.d)+')\n':'';
    t+=bp?'Pressão: '+bp.s+'/'+bp.di+' (em '+dm(bp.d)+')\n':'';
    t+='Treinos nesta semana: '+weekHist().length+' de '+wkg()+'\n';
    t+='Água hoje: '+(S.water||0)+' de '+wg()+' copos\n';
    try{if(navigator.share){navigator.share({text:t}).catch(()=>{});}else{navigator.clipboard.writeText(t).then(()=>toast('Resumo copiado!'),()=>toast('Não consegui copiar'));}}catch(er){toast('Não consegui copiar');}}
  else if(a==='avdel'){delete S.avatar;save();render();}
  else if(a==='teamwa'){const f=b.dataset.f,d=((S.team||{})[f+'t']||'').replace(/\D/g,'');
    if(d.length<10){toast('Digite o WhatsApp com DDD primeiro');}else{window.open('https://wa.me/'+(d.length<=11?'55'+d:d),'_blank','noopener');}}
  else if(a==='rfeita'){celebrate('Parabéns! Você cozinhou: '+b.dataset.n+' 👩‍🍳',true);}
  else if(a==='shopclear'){S.shop={};save();render();}
  else if(a==='shopshare'){const t=shopText();try{if(navigator.share){navigator.share({text:t}).catch(()=>{});}else{navigator.clipboard.writeText(t).then(()=>toast('Lista copiada!'),()=>toast('Não consegui copiar'));}}catch(er){toast('Não consegui enviar');}}
  else if(a==='timer'){startTimer(+b.dataset.sec,b.dataset.l);}
  else if(a==='pause'){animPaused=!animPaused;b.textContent=animPaused?'Continuar':'Pausar';}
  else if(a==='water'){S.water=Math.max(0,(S.water||0)+(+b.dataset.d));S.wh[today]=S.water;save();render();if(+b.dataset.d>0&&S.water===wg())celebrate('Meta de água batida! 💧',true);}
  else if(a==='meal'){const m=b.dataset.m;S.meals[m]=!S.meals[m];save();render();if(S.meals[m]){if(MEALS.every(x=>S.meals[x[0]]))celebrate('Todas as refeições do dia! 🥗',true);else celebrate(PRAISE[Math.floor(Math.random()*PRAISE.length)],false);}}
  else if(a==='finish'){doFinish();}
  else if(a==='calp'){calM--;if(calM<0){calM=11;calY--;}render();}
  else if(a==='caln'){calM++;if(calM>11){calM=0;calY++;}render();}
  else if(a==='cal'){selD=b.dataset.d;render();}
  else if(a==='goTreino'){view='treino';openId=null;render();window.scrollTo({top:0});}
  else if(a==='pd'){const w=+b.dataset.w,i=S.plan.indexOf(w);if(i>=0){if(S.plan.length>1)S.plan.splice(i,1);}else{S.plan.push(w);S.plan.sort();}save();render();}
  else if(a==='wgm'){S.waterGoal=Math.max(4,wg()-1);save();render();}
  else if(a==='wgp'){S.waterGoal=Math.min(16,wg()+1);save();render();}
  else if(a==='cgm'){S.cardioGoal=Math.max(60,cg()-30);save();render();}
  else if(a==='cgp'){S.cardioGoal=Math.min(420,cg()+30);save();render();}
  else if(a==='saveS'){const n=num(val('in-sl'));if(n>=2&&n<=14){upsert(S.sleep,{d:today,h:n});save();render();}else{flash('in-sl');}}
  else if(a==='delph'){const i=+b.dataset.i;if(PH[i]){PH.splice(i,1);savePh();render();}}
  else if(a==='ck'){S.checks.push({d:today,e:+val('ck-e'),l:+val('ck-l'),a:+val('ck-a')});S.checks=S.checks.slice(-60);ckPending=false;save();render();}
  else if(a==='ckskip'){ckPending=false;render();}
  else if(a==='saveW'){const n=num(val('in-w'));if(n>=25&&n<=300){upsert(S.weights,{d:today,kg:n});save();render();}else{flash('in-w');}}
  else if(a==='saveC'){const n=num(val('in-c'));if(n>=40&&n<=200){upsert(S.waist,{d:today,cm:n});save();render();}else{flash('in-c');}}
  else if(a==='saveP'){let s=num(val('in-s')),d=num(val('in-di'));if(s<30)s*=10;if(d<20)d*=10;
    if(s>=70&&s<=260&&d>=40&&d<=150&&s>d){S.bp.push({d:today,s:Math.round(s),di:Math.round(d)});S.bp=S.bp.slice(-100);save();render();}else{flash('in-s');flash('in-di');}}
  else if(a==='del'){const t=b.dataset.t,i=+b.dataset.i;if(S[t]&&S[t][i]!==undefined){if(t==='weights'&&S.weights.length<=1)return;S[t].splice(i,1);save();render();}}
  else if(a==='conv'){const m=document.getElementById('convmsg');m.style.display='block';m.textContent=b.dataset.m;}
  else if(a==='addc'||a==='addc2'){const n=a==='addc'?+b.dataset.m:num(val('in-cm'));if(n>0&&n<=300){S.cardio.push({d:today,min:Math.round(n)});S.cardio=S.cardio.slice(-400);save();render();}else{flash('in-cm');}}
  else if(a==='copy'){
    const txt=JSON.stringify(S),ta=document.getElementById('bk'),msg=document.getElementById('bkmsg');
    ta.value=txt;ta.select();
    const ok=()=>{msg.textContent='Copiado! Cole num bloco de notas e guarde.';};
    try{navigator.clipboard.writeText(txt).then(ok,()=>{msg.textContent='Toque no texto acima, selecione tudo e copie.';});}catch(er){msg.textContent='Toque no texto acima, selecione tudo e copie.';}
  }
  else if(a==='restore'){
    const msg=document.getElementById('bkmsg');
    try{const o=JSON.parse(val('bk'));if(!o||typeof o!=='object'||!Array.isArray(o.hist))throw 0;
      ['hist','weights','waist','bp','cardio','checks','plan','sleep'].forEach(k=>{if(Array.isArray(o[k]))S[k]=o[k];});
      ['kg','kgHist','wh'].forEach(k=>{if(o[k]&&typeof o[k]==='object')S[k]=o[k];});
      if(typeof o.age==='number')S.age=o.age;
      if(typeof o.waterGoal==='number')S.waterGoal=o.waterGoal;
      if(typeof o.cardioGoal==='number')S.cardioGoal=o.cardioGoal;
      if(!S.plan.length)S.plan=[1,2,3,4,5];
      if(!S.weights.length)S.weights.push({d:today,kg:60,seed:1});
      save();render();
    }catch(er){msg.textContent='Não consegui ler. Cole o texto completo que você copiou.';}
  }
});
function flash(id){const e=document.getElementById(id);if(e){e.focus();e.classList.add('bad');}}
document.getElementById('app').addEventListener('input',e=>{
  const i=e.target.closest('[data-act]'); if(!i)return;
  const a=i.dataset.act;
  if(a==='kg'){S.kg[i.dataset.id]=i.value;save();}
  else if(a==='yas'){S.yas=S.yas||{list:[]};S.yas[i.dataset.f]=i.value;save();}
  else if(a==='prof'){S.prof=S.prof||{};S.prof[i.dataset.f]=i.value;save();}
  else if(a==='team'){S.team=S.team||{};S.team[i.dataset.f]=i.value;save();}
  else if(a==='rng'){const o=document.getElementById(i.id+'-o');if(o)o.textContent=i.value;}
  else if(a==='bpm'){const mx=220-S.age,n=num(i.value);const ok=n>=30&&n<=230;S.lastBpm=ok?Math.round(n):0;
    document.getElementById('gauge').innerHTML=gauge(S.lastBpm,mx);
    const z=ok?zoneInfo(n,mx):null;document.getElementById('zmsg').innerHTML=z?'<b>'+z[0]+':</b> '+z[1]:'Digite os batimentos que aparecem no aparelho ou no relógio para ver em que faixa você está.';}
});
document.getElementById('app').addEventListener('change',e=>{
  const ph=e.target.closest('[data-act="photo"]');
  if(ph){if(ph.files&&ph.files[0])addPhoto(ph.files[0]);return;}
  const av=e.target.closest('[data-act="avatar"]');if(av){if(av.files&&av.files[0])addAvatar(av.files[0]);return;}
  const i=e.target.closest('[data-act="age"]'); if(!i)return;
  const n=Math.round(num(i.value));if(n>=18&&n<=90){S.age=n;save();render();}
});
render();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}</script>
