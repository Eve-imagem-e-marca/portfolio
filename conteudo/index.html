  if(a.passo===1){h+='<p class="cap-sub" style="margin:0 0 10px;font-size:14.5px">Escolha uma opção.</p>'+TIPOS.map(function(x){return'<button type="button" class="au-op'+(a.tipo===x.id?" sel":"")+'" data-au="tipo" data-v="'+x.id+'">'+x.n+"<small>"+x.d+"</small></button>"}).join("")+nav(a,pronto(a))}
  else if(a.passo===2){
    if(t.txt){h+='<p class="cap-sub" style="margin:0 0 8px;font-size:14.5px">Pode ser bagunçado. O que importa é a ideia.</p><textarea id="au-txt" rows="9" class="campo" placeholder="Cole ou escreva aqui">'+esc(a.texto)+'</textarea><details class="menu-oculto" name="au-dica" style="margin:10px 0 0"><summary>Prefere falar em vez de digitar?</summary><div class="menu-oculto-corpo"><p style="margin:0;font-size:15.5px;line-height:1.55">No teclado do celular, toque no microfone e fale. O texto aparece sozinho na caixa.</p></div></details>'+(t.fonte?'<label class="lab">Nome do autor e do livro</label><input type="text" id="au-fonte" class="campo" placeholder="Ex.: Nome do autor, título do livro" value="'+esc(a.fonte)+'"><p class="cap-sub" style="margin:6px 0 0;font-size:14.5px">Escreva igual está no livro, para não sair autor errado.</p>':"")}
    else{var ft=t.id==="foto";h+='<div style="padding:12px;border-radius:12px;background:#F3E9D8"><p style="margin:0 0 6px;font-size:16px"><b>'+(ft?"A foto vai direto para o Gemini":"O áudio vai direto para o Gemini")+'</b></p><p style="margin:0;font-size:15.5px;line-height:1.55">Não precisa subir nada aqui. No passo 4 eu mostro onde anexar '+(ft?"a foto da anotação, do print ou da página":"o áudio da cliente ou da palestra")+".</p></div><p class='cap-sub' style='margin:10px 0 0;font-size:14.5px'>"+(ft?"Dica: tire a foto de frente para o papel, com a luz que tiver.":"Dica: áudio com pouco ruído fica melhor.")+"</p>"}
    h+=nav(a,pronto(a))}
  else if(a.passo===3){var e=est();h+=FORMS.map(function(x){return'<button type="button" class="au-op'+(a.formato===x.id?" sel":"")+'" data-au="form" data-v="'+x.id+'">'+x.n+"<small>"+x.d+"</small></button>"}).join("")
    +'<label class="lab">Qual é a sua área?</label><select id="au-area" class="field-select campo"><option value="">Escolha...</option>'+AREAS.map(function(x){return'<option'+(a.area===x?" selected":"")+">"+x+"</option>"}).join("")+'</select><label class="lab">Para quem você fala?</label><input type="text" id="au-para" class="campo" placeholder="Ex.: mulheres que empreendem sozinhas" value="'+esc(para(a))+'"><label class="lab">Estilo do conteúdo (opcional)</label><select id="au-estilo" class="field-select campo">'+ESTILOS.map(function(x){return'<option value="'+x.id+'"'+((a.estilo||"")===x.id?" selected":"")+">"+x.n+"</option>"}).join("")+'</select><p class="cap-sub" style="margin:6px 0 0;font-size:14.5px">Se não souber, deixe o Gemini escolher.</p>'+nav(a,pronto(a))}
  else if(a.passo===4){var ex=!t.txt;h+='<p style="font-size:15px;margin:0 0 6px"><span class="nx-tag" style="margin:0 8px 0 0">1</span><b>Copie o comando e abra o Gemini</b></p><button type="button" class="btn btn-primary au-pulse" style="width:100%;min-height:50px;font-size:16px" data-au="gem">Copiar e abrir o Gemini</button><p class="cap-sub" style="margin:8px 0 12px;font-size:14.5px">Entre com o seu Gmail. É grátis.</p>'
    +(ex?'<p style="font-size:15px;margin:0 0 6px"><span class="nx-tag" style="margin:0 8px 0 0">2</span><b>Anexe '+(t.id==="foto"?"a foto":"o áudio")+'</b></p><p class="cap-sub" style="margin:0 0 12px;font-size:14.5px;line-height:1.5">No Gemini, toque no <b>+</b> e escolha o arquivo.</p>':"")
    +'<p style="font-size:15px;margin:0 0 6px"><span class="nx-tag" style="margin:0 8px 0 0">'+(ex?3:2)+'</span><b>Cole o comando e envie</b></p><p class="cap-sub" style="margin:0 0 12px;font-size:14.5px">Quando o texto ficar pronto, volte aqui.</p><details class="menu-oculto" name="au-dica" style="margin:0"><summary>Ver o comando</summary><div class="menu-oculto-corpo"><p style="margin:0;font-size:14.5px;line-height:1.5;white-space:pre-wrap">'+esc(cmd(a))+"</p></div></details>"+nav(a,true,"Já tenho o texto →")}
  else{h+='<p class="cap-sub" style="margin:0 0 8px;font-size:14.5px">Cole aqui o que o Gemini criou. Assim fica guardado no app.</p><textarea id="au-res" rows="9" class="campo" placeholder="Cole aqui o texto pronto">'+esc(a.res)+'</textarea>';
    if(a.feito){h+='<div style="margin:12px 0 0;padding:12px;border-radius:12px;background:#E4EEEF"><p style="margin:0 0 6px;font-size:16px"><b>Guardado.</b></p><p style="margin:0;font-size:15.5px;line-height:1.55">Ele fica em "Meus conteúdos guardados", neste celular. Próximo passo: copie o texto e cole na hora de postar no Instagram.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button type="button" class="btn btn-primary" style="flex:1" data-au="rcopy">Copiar o texto</button><a class="btn btn-ghost" style="flex:1;text-decoration:none" href="https://www.instagram.com/" target="_blank" rel="noopener">Abrir o Instagram</a></div><button type="button" class="btn btn-ghost" style="width:100%;margin-top:10px" data-au="novo">Criar outro conteúdo</button>'}
    else{h+='<div style="display:flex;gap:10px;margin-top:18px"><button type="button" class="btn btn-ghost" style="min-height:48px;font-size:16px" data-au="volta">← Voltar</button><button type="button" class="btn btn-primary" id="au-guardar" style="min-height:48px;font-size:16px;flex:1" data-au="guardar"'+(String(a.res).trim().length>20?"":" disabled")+'>Guardar no app</button></div><p class="cap-sub" style="margin:8px 0 0;font-size:14.5px">Guardar no app salva o texto neste celular, para você achar depois.</p><p style="margin:10px 0 0;text-align:center"><button type="button" class="btn btn-ghost btn-sm" data-au="fim">Encerrar</button></p>'}}
  h+="</div>"+salvosHTML(a);root.innerHTML=h}
function zerar(){var a=A();a.passo=1;a.tipo="";a.texto="";a.fonte="";a.formato="";a.estilo="";a.res="";a.feito=false}
function top(){try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){}}
root.addEventListener("input",function(ev){var t=ev.target,a=A();
  if(t.id==="au-txt")a.texto=t.value;else if(t.id==="au-fonte")a.fonte=t.value;else if(t.id==="au-para")a.para=t.value;else if(t.id==="au-res"){a.res=t.value;var g=document.getElementById("au-guardar");if(g)g.disabled=!(String(t.value).trim().length>20);persist();return}else return;
  persist();var b=root.querySelector('[data-au="prox"]');if(b)b.disabled=!pronto(a)});
root.addEventListener("change",function(ev){var t=ev.target,a=A();if(t.id==="au-estilo"){a.estilo=t.value;persist();return}if(t.id==="au-area"){a.area=t.value;persist();var b=root.querySelector('[data-au="prox"]');if(b)b.disabled=!pronto(a)}});
root.addEventListener("click",function(ev){var b=ev.target.closest&&ev.target.closest("[data-au]");if(!b)return;var k=b.getAttribute("data-au"),a=A();
  if(k==="tipo"){a.tipo=b.getAttribute("data-v");persist();draw()}
  else if(k==="form"){a.formato=b.getAttribute("data-v");persist();draw()}
  else if(k==="prox"){if(!pronto(a))return;a.passo=Math.min(5,a.passo+1);persist();draw();top()}
  else if(k==="volta"){a.passo=Math.max(1,a.passo-1);a.feito=false;persist();draw();top()}
  else if(k==="gem"){if(!pronto(a))return;cp(cmd(a),"Comando copiado. Cole no Gemini.");window.open(IA_LINKS.gemini.url,"_blank","noopener")}
  else if(k==="guardar"){var tx=String(a.res).trim();if(tx.length<=20)return;var f=get(FORMS,a.formato);a.salvos.unshift({t:tx,f:f?f.n:"",d:new Date().toLocaleDateString("pt-BR")});a.salvos=a.salvos.slice(0,30);a.feito=true;persist();draw();toast("Guardado no app.")}
  else if(k==="rcopy"){cp(String(a.res).trim(),"Texto copiado.")}
  else if(k==="novo"){zerar();persist();draw();top()}
  else if(k==="fim"){zerar();persist();draw();top();toast("Encerrado.")}
  else if(k==="scopy"){var s=a.salvos[+b.getAttribute("data-i")];if(s)cp(s.t,"Texto copiado.")}
  else if(k==="sdel"){a.salvos.splice(+b.getAttribute("data-i"),1);persist();draw()}});
document.querySelector(".tabs").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;var n=b.getAttribute("data-tab");root.style.display=n==="aut"?"":"none";if(n==="aut")draw()});
})();
</script></body></html>
